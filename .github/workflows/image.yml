name: Build and push image
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - handler.py
      - .github/workflows/image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift || true
          df -h
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/noobdr123/bs-roformer-stems:latest
            ghcr.io/noobdr123/bs-roformer-stems:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Make the package public so Runpod can pull it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            gh api --method PUT /user/packages/container/bs-roformer-stems/visibility \
              -f visibility=public && break
            sleep 5
          done
